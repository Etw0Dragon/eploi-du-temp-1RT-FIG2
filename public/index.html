<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="theme-color" content="#0d6efd" />
    <title>EDT R&amp;T</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/@supabase/supabase-js@2" defer></script>
    <script src="./supabase-config.js" defer></script>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./todo.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand bg-primary sticky-top px-3 py-2" aria-label="Navigation de l'emploi du temps">
      <a class="navbar-brand fw-semibold text-white mb-0 me-3" href="#agenda" aria-label="Voir l'agenda">EDT</a>
      <div class="nav nav-pills nav-tabs-edt me-2" aria-label="Sections du site">
        <button id="agenda-tab" class="nav-link active" type="button">Agenda</button>
        <button id="todo-tab" class="nav-link" type="button">Devoirs</button>
      </div>
      <select id="group-select" class="form-select form-select-sm w-auto" aria-label="Choisir le groupe"></select>
      <div class="d-flex align-items-center gap-1 ms-auto agenda-actions" aria-label="Navigation entre les semaines">
        <button id="previous-week" class="btn btn-sm btn-outline-light" type="button" aria-label="Semaine précédente">←</button>
        <button id="current-week" class="btn btn-sm btn-light text-primary" type="button"><span id="week-label"></span></button>
        <button id="next-week" class="btn btn-sm btn-outline-light" type="button" aria-label="Semaine suivante">→</button>
      </div>
      <button id="refresh-button" class="btn btn-sm btn-outline-light ms-1" type="button" aria-label="Actualiser l'emploi du temps">↻</button>
    </nav>

    <main class="container-fluid px-3 px-md-4 py-3">
      <section id="agenda-view">
        <div id="next-card" class="next-card mb-1" aria-live="polite"><p class="text-body-secondary small mb-0">Chargement…</p></div>
        <p id="sync-status" class="small text-body-secondary mb-3" aria-live="polite"></p>
        <div id="week-grid" class="week-grid" aria-live="polite"></div>
      </section>

      <section id="todo-view" hidden aria-live="polite">
        <div class="todo-toolbar">
          <div>
            <p class="todo-eyebrow mb-0">FI1G2</p>
            <h1 class="todo-title mb-0">À faire</h1>
          </div>
          <button id="add-homework-button" class="btn btn-primary todo-add" type="button">+ Ajouter</button>
        </div>
        <div class="todo-filters" role="group" aria-label="Filtrer les devoirs">
          <button class="btn btn-sm btn-primary" data-todo-filter="open" type="button">À faire</button>
          <button class="btn btn-sm btn-outline-primary" data-todo-filter="all" type="button">Tous</button>
          <button class="btn btn-sm btn-outline-primary" data-todo-filter="done" type="button">Terminés</button>
          <button class="btn btn-sm btn-outline-secondary ms-auto" id="archives-button" type="button">Archives</button>
        </div>
        <p id="todo-status" class="small text-body-secondary mt-3 mb-2" aria-live="polite"></p>
        <div id="todo-list"></div>
      </section>
    </main>

    <dialog id="homework-dialog" class="homework-dialog">
      <form id="homework-form" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="todo-eyebrow mb-0">Nouveau devoir</p>
            <h2 id="homework-dialog-title" class="h4 mb-0">À ajouter</h2>
          </div>
          <button class="btn-close" type="button" id="close-homework-dialog" aria-label="Fermer"></button>
        </div>
        <div class="mb-3"><label class="form-label" for="homework-author">Ton pseudo</label><input id="homework-author" class="form-control" name="author" maxlength="32" required autocomplete="nickname" placeholder="Ex. Léa" /></div>
        <div class="mb-3"><label class="form-label" for="homework-subject">Matière</label><input id="homework-subject" class="form-control" name="subject" maxlength="60" required placeholder="Ex. Réseaux" /></div>
        <div class="mb-3"><label class="form-label" for="homework-title">Devoir</label><input id="homework-title" class="form-control" name="title" maxlength="120" required placeholder="Ex. Compte rendu du TP 2" /></div>
        <div class="row g-2 mb-3">
          <div class="col-7"><label class="form-label" for="homework-date">À rendre le</label><input id="homework-date" class="form-control" name="dueDate" type="date" required /></div>
          <div class="col-5"><label class="form-label" for="homework-time">Heure</label><input id="homework-time" class="form-control" name="dueTime" type="time" /></div>
        </div>
        <div class="mb-3"><label class="form-label" for="homework-description">Précisions <span class="text-body-secondary">(facultatif)</span></label><textarea id="homework-description" class="form-control" name="description" rows="3" maxlength="1200" placeholder="Consignes, format attendu…"></textarea></div>
        <div class="mb-4"><label class="form-label" for="homework-link">Lien <span class="text-body-secondary">(facultatif)</span></label><input id="homework-link" class="form-control" name="link" type="url" inputmode="url" placeholder="https://moodle.univ-rennes.fr/…" /></div>
        <p id="homework-form-status" class="small mb-3" aria-live="polite"></p>
        <div class="d-flex justify-content-end gap-2"><button class="btn btn-outline-secondary" type="button" id="cancel-homework-dialog">Annuler</button><button class="btn btn-primary" type="submit" id="save-homework-button">Publier</button></div>
      </form>
    </dialog>
  </body>
</html>
